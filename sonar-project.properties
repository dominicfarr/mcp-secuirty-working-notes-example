sonar.projectKey=dominicfarr_mcp-secuirty-working-notes-example
sonar.organization=dominicfarr

sonar.sources=client,server,.github
sonar.tests=tests
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

# Fail the CI run when the quality gate fails
sonar.qualitygate.wait=true

# S2083 (path injection) on server.py is a reviewed false positive: every file tool and the
# workspace:// resource resolve their path through resolve_in_workspace and resolve_allowed
# (realpath + commonpath inside the workspace, then the allowed folder) before any I/O. Proven by
# tests/test_workspace.py and tests/test_folder.py, and by sabotage runs that remove the check.
# Sonar's taint analysis doesn't follow that check across functions, so the ignore is scoped to
# this one rule in this one file.
sonar.issue.ignore.multicriteria=s2083
sonar.issue.ignore.multicriteria.s2083.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.s2083.resourceKey=server/server.py
