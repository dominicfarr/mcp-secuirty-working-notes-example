sonar.projectKey=dominicfarr_mcp-secuirty-working-notes-example
sonar.organization=dominicfarr

sonar.sources=client,server,.github
sonar.tests=tests
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

# client/host.py is the stale pre-Part 2 LLM host: not analysed, tested or linted until Part 2
# rewrites it
sonar.exclusions=client/host.py

# Fail the CI run when the quality gate fails
sonar.qualitygate.wait=true
