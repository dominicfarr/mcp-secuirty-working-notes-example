name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only needs to read the repository
permissions:
  contents: read

jobs:
  test:
    # A hung test fails the run instead of holding a runner for hours
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu pinned to a release so a runner-image migration (ubuntu-latest -> 26.04) is a
        # deliberate change here, not a surprise in CI
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs (Sonar S7637)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Lock matches requirements
        # A requirements change without a regenerated lock (e.g. a Dependabot PR) fails here
        # instead of silently testing the old versions
        run: |
          for pin in $(grep -h -o '^[A-Za-z0-9_.-]*==[^ ]*' requirements.txt requirements-dev.txt); do
            grep -qi "^${pin} " requirements-dev.lock || { echo "::error::$pin is not in requirements-dev.lock"; exit 1; }
          done
      - name: Install
        # Every package hash-checked and installed from a wheel, so no setup scripts run (Sonar S8544, S8541)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock
      - name: Lint client
        working-directory: client
        run: python -m pylint --rcfile=../.pylintrc $(ls ./*.py)
      - name: Lint server
        working-directory: server
        run: python -m pylint --rcfile=../.pylintrc ./*.py
      - name: Test
        run: python -m pytest
