name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only needs to read the repository
permissions:
  contents: read

jobs:
  test:
    # A hung test fails the run instead of holding a runner for hours
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs (Sonar S7637)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # SonarQube Cloud needs the full history to tell new code from old
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Lock matches requirements
        # A requirements change without a regenerated lock (e.g. a Dependabot PR) fails here
        # instead of silently testing the old versions
        run: |
          for pin in $(grep -h -o '^[A-Za-z0-9_.-]*==[^ ]*' requirements.txt requirements-dev.txt); do
            grep -qi "^${pin} " requirements-dev.lock || { echo "::error::$pin is not in requirements-dev.lock"; exit 1; }
          done
      - name: Install
        # Every package hash-checked and installed from a wheel, so no setup scripts run (Sonar S8544, S8541)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock
      - name: Lint client
        working-directory: client
        run: python -m pylint --rcfile=../.pylintrc $(ls ./*.py | grep -v host.py)
      - name: Lint server
        working-directory: server
        run: python -m pylint --rcfile=../.pylintrc ./*.py
      - name: Test
        # Under coverage (settings in .coveragerc), which also follows the server child process
        run: |
          python -m coverage run -m pytest
          python -m coverage combine
          python -m coverage xml
      - name: SonarQube Cloud
        # One analysis per push is enough; Ubuntu's coverage report stands for both
        if: matrix.os == 'ubuntu-latest'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
